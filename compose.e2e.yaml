services:
  traefik:
    profiles:
      - proxy

  frontend:
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://backend:8000/api
      NEXT_PUBLIC_API_BASE_URL: /api
      CODRUT_FRONTEND_DEMO_FALLBACK: "false"
      NEXT_PUBLIC_CODRUT_FRONTEND_DEMO_FALLBACK: "false"
      CODRUT_LOCAL_AUTH_BYPASS: "false"
      NEXT_PUBLIC_CODRUT_LOCAL_AUTH_BYPASS: "false"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  backend:
    environment:
      CODRUT_ENV: test
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_SESSION_SECRET: e2e-session-secret-with-at-least-32-characters
      CODRUT_TASK_LINK_SECRET: e2e-task-link-secret-with-at-least-32-characters
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: e2e-asset-secret-with-at-least-32-characters
      CODRUT_LOCAL_AUTH_BYPASS: "false"
      CODRUT_CORS_ORIGINS: '["http://localhost:3000"]'
      CODRUT_PUBLIC_APP_URL: http://localhost:3000
      CODRUT_EMAIL_PROVIDER: mailpit
      CODRUT_EMAIL_FROM_ADDRESS: no-reply@codrut.local
      CODRUT_EMAIL_FROM_NAME: Cody
      CODRUT_EMAIL_WEBHOOK_TOKEN: e2e-webhook-token-with-at-least-32-characters
      CODRUT_EMAIL_SMTP_HOST: mailpit
      CODRUT_EMAIL_SMTP_PORT: "1025"
      CODRUT_EMAIL_SMTP_STARTTLS: "false"
      CODRUT_PASSWORD_BREACH_CHECK_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    environment:
      CODRUT_ENV: test
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_SESSION_SECRET: e2e-session-secret-with-at-least-32-characters
      CODRUT_TASK_LINK_SECRET: e2e-task-link-secret-with-at-least-32-characters
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: e2e-asset-secret-with-at-least-32-characters
      CODRUT_CORS_ORIGINS: '["http://localhost:3000"]'
      CODRUT_PUBLIC_APP_URL: http://localhost:3000
      CODRUT_EMAIL_PROVIDER: mailpit
      CODRUT_EMAIL_FROM_ADDRESS: no-reply@codrut.local
      CODRUT_EMAIL_FROM_NAME: Cody
      CODRUT_EMAIL_WEBHOOK_TOKEN: e2e-webhook-token-with-at-least-32-characters
      CODRUT_EMAIL_SMTP_HOST: mailpit
      CODRUT_EMAIL_SMTP_PORT: "1025"
      CODRUT_EMAIL_SMTP_STARTTLS: "false"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
