x-codrut-logging: &codrut-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
    logging: *codrut-logging
    restart: unless-stopped

  frontend:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api
      CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-false}
      NEXT_PUBLIC_CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-false}
      CODRUT_LOCAL_AUTH_BYPASS: "false"
      NEXT_PUBLIC_CODRUT_LOCAL_AUTH_BYPASS: "false"
    labels:
      traefik.http.middlewares.codrut-hsts.headers.stsSeconds: "31536000"
      traefik.http.middlewares.codrut-hsts.headers.stsIncludeSubdomains: "true"
      traefik.http.routers.codrut-frontend.rule: Host(`${CODRUT_HOST}`)
      traefik.http.routers.codrut-frontend.entrypoints: websecure
      traefik.http.routers.codrut-frontend.middlewares: codrut-hsts
      traefik.http.routers.codrut-frontend.tls.certresolver: letsencrypt
    logging: *codrut-logging
    restart: unless-stopped

  backend:
    command:
      - uvicorn
      - codrut.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${CODRUT_API_WORKERS:-4}
      - --no-access-log
    environment:
      CODRUT_ENV: ${CODRUT_ENV:-production}
      CODRUT_DATABASE_URL: ${CODRUT_DATABASE_URL}
      CODRUT_DB_POOL_SIZE: ${CODRUT_DB_POOL_SIZE:-5}
      CODRUT_DB_MAX_OVERFLOW: ${CODRUT_DB_MAX_OVERFLOW:-5}
      CODRUT_DB_POOL_TIMEOUT_SECONDS: ${CODRUT_DB_POOL_TIMEOUT_SECONDS:-10}
      CODRUT_WORKER_MAX_JOBS: ${CODRUT_WORKER_MAX_JOBS:-3}
      CODRUT_REDIS_URL: ${CODRUT_REDIS_URL}
      CODRUT_SESSION_SECRET: ${CODRUT_SESSION_SECRET:?Set CODRUT_SESSION_SECRET to a unique secret of at least 32 characters}
      CODRUT_LOCAL_AUTH_BYPASS: "false"
      CODRUT_TASK_LINK_SECRET: ${CODRUT_TASK_LINK_SECRET:?Set CODRUT_TASK_LINK_SECRET to a stable separate signing secret}
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: ${CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET:?Set CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET to a stable dedicated signing secret}
      CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET: ${CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET:?Set CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET to a stable dedicated fingerprint secret}
      CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS:-30}
      CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS:-7}
      CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED: ${CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED:-true}
      CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS:-365}
      CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS: ${CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS:-365}
      CODRUT_CORS_ORIGINS: ${CODRUT_CORS_ORIGINS}
      CODRUT_PUBLIC_APP_URL: ${CODRUT_PUBLIC_APP_URL:?Set CODRUT_PUBLIC_APP_URL to the public app origin, for example https://cody.andreivacaru.ro}
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:?Set CODRUT_EMAIL_PROVIDER to brevo}
      CODRUT_EMAIL_BREVO_SANDBOX_ENABLED: ${CODRUT_EMAIL_BREVO_SANDBOX_ENABLED:-false}
      CODRUT_EMAIL_DAILY_SEND_CAP: ${CODRUT_EMAIL_DAILY_SEND_CAP:-2000}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:?Set CODRUT_EMAIL_FROM_ADDRESS to the verified sender email address}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:?Set CODRUT_EMAIL_FROM_NAME to the sender display name}
      CODRUT_RATE_LIMIT_ENABLED: "true"
      CODRUT_RATE_LIMIT_BACKEND: redis
      CODRUT_RATE_LIMIT_INVITE_EXCHANGE_MAX_REQUESTS: ${CODRUT_RATE_LIMIT_INVITE_EXCHANGE_MAX_REQUESTS:-2000}
      CODRUT_RATE_LIMIT_TRUSTED_PROXIES: ${CODRUT_RATE_LIMIT_TRUSTED_PROXIES:?Set CODRUT_RATE_LIMIT_TRUSTED_PROXIES to a JSON array of trusted proxy IPs or CIDRs}
      CODRUT_MAINTENANCE_MODE: ${CODRUT_MAINTENANCE_MODE:-false}
      CODRUT_MAINTENANCE_BYPASS_TOKEN: ${CODRUT_MAINTENANCE_BYPASS_TOKEN:-}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:?Set CODRUT_EMAIL_BREVO_API_KEY to the production Brevo API key}
      CODRUT_EMAIL_WEBHOOK_TOKEN: ${CODRUT_EMAIL_WEBHOOK_TOKEN:?Set CODRUT_EMAIL_WEBHOOK_TOKEN to an independent bearer token for Brevo callbacks}
      CODRUT_PASSWORD_BREACH_CHECK_ENABLED: ${CODRUT_PASSWORD_BREACH_CHECK_ENABLED:-true}
    labels:
      traefik.http.routers.codrut-api.rule: Host(`${CODRUT_HOST}`) && PathPrefix(`/api`)
      traefik.http.routers.codrut-api.entrypoints: websecure
      traefik.http.routers.codrut-api.middlewares: codrut-hsts
      traefik.http.routers.codrut-api.tls.certresolver: letsencrypt
    logging: *codrut-logging
    restart: unless-stopped

  worker:
    environment:
      CODRUT_ENV: ${CODRUT_ENV:-production}
      CODRUT_DATABASE_URL: ${CODRUT_DATABASE_URL}
      CODRUT_DB_POOL_SIZE: ${CODRUT_DB_POOL_SIZE:-5}
      CODRUT_DB_MAX_OVERFLOW: ${CODRUT_DB_MAX_OVERFLOW:-5}
      CODRUT_DB_POOL_TIMEOUT_SECONDS: ${CODRUT_DB_POOL_TIMEOUT_SECONDS:-10}
      CODRUT_REDIS_URL: ${CODRUT_REDIS_URL}
      CODRUT_SESSION_SECRET: ${CODRUT_SESSION_SECRET:?Set CODRUT_SESSION_SECRET to a unique secret of at least 32 characters}
      CODRUT_TASK_LINK_SECRET: ${CODRUT_TASK_LINK_SECRET:?Set CODRUT_TASK_LINK_SECRET to a stable separate signing secret}
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: ${CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET:?Set CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET to a stable dedicated signing secret}
      CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET: ${CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET:?Set CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET to a stable dedicated fingerprint secret}
      CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS:-30}
      CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS:-7}
      CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED: ${CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED:-true}
      CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS:-365}
      CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS: ${CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS:-365}
      CODRUT_CORS_ORIGINS: ${CODRUT_CORS_ORIGINS:?Set CODRUT_CORS_ORIGINS to a JSON array of production HTTPS origins}
      CODRUT_PUBLIC_APP_URL: ${CODRUT_PUBLIC_APP_URL:?Set CODRUT_PUBLIC_APP_URL to the public app origin, for example https://cody.andreivacaru.ro}
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:?Set CODRUT_EMAIL_PROVIDER to brevo}
      CODRUT_EMAIL_BREVO_SANDBOX_ENABLED: ${CODRUT_EMAIL_BREVO_SANDBOX_ENABLED:-false}
      CODRUT_EMAIL_DAILY_SEND_CAP: ${CODRUT_EMAIL_DAILY_SEND_CAP:-2000}
      CODRUT_EMAIL_OUTBOX_BATCH_SIZE: ${CODRUT_EMAIL_OUTBOX_BATCH_SIZE:-100}
      CODRUT_EMAIL_OUTBOX_CONCURRENCY: ${CODRUT_EMAIL_OUTBOX_CONCURRENCY:-8}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:?Set CODRUT_EMAIL_FROM_ADDRESS to the verified sender email address}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:?Set CODRUT_EMAIL_FROM_NAME to the sender display name}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:?Set CODRUT_EMAIL_BREVO_API_KEY to the production Brevo API key}
      CODRUT_EMAIL_WEBHOOK_TOKEN: ${CODRUT_EMAIL_WEBHOOK_TOKEN:?Set CODRUT_EMAIL_WEBHOOK_TOKEN to an independent bearer token for Brevo callbacks}
    logging: *codrut-logging
    restart: unless-stopped

  db:
    logging: *codrut-logging
    restart: unless-stopped

  redis:
    logging: *codrut-logging
    restart: unless-stopped

volumes:
  traefik_letsencrypt:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CODRUT_DB_VOLUME_PATH}
