services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
    restart: unless-stopped

  frontend:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api
      CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-false}
      NEXT_PUBLIC_CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-false}
      CODRUT_LOCAL_AUTH_BYPASS: "false"
      NEXT_PUBLIC_CODRUT_LOCAL_AUTH_BYPASS: "false"
    labels:
      traefik.http.routers.codrut-frontend.rule: Host(`${CODRUT_HOST}`)
      traefik.http.routers.codrut-frontend.entrypoints: websecure
      traefik.http.routers.codrut-frontend.tls.certresolver: letsencrypt
    restart: unless-stopped

  backend:
    environment:
      CODRUT_ENV: ${CODRUT_ENV:-production}
      CODRUT_DATABASE_URL: ${CODRUT_DATABASE_URL}
      CODRUT_REDIS_URL: ${CODRUT_REDIS_URL}
      CODRUT_SESSION_SECRET: ${CODRUT_SESSION_SECRET:?Set CODRUT_SESSION_SECRET to a unique secret of at least 32 characters}
      CODRUT_LOCAL_AUTH_BYPASS: "false"
      CODRUT_TASK_LINK_SECRET: ${CODRUT_TASK_LINK_SECRET:?Set CODRUT_TASK_LINK_SECRET to a stable separate signing secret}
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: ${CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET:?Set CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET to a stable dedicated signing secret}
      CODRUT_CORS_ORIGINS: ${CODRUT_CORS_ORIGINS}
      CODRUT_PUBLIC_APP_URL: ${CODRUT_PUBLIC_APP_URL:?Set CODRUT_PUBLIC_APP_URL to the public app origin, for example https://codrut.andreivacaru.ro}
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:?Set CODRUT_EMAIL_PROVIDER to brevo}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:?Set CODRUT_EMAIL_FROM_ADDRESS to the verified sender email address}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:?Set CODRUT_EMAIL_FROM_NAME to the sender display name}
      CODRUT_RATE_LIMIT_ENABLED: "true"
      CODRUT_RATE_LIMIT_BACKEND: redis
      CODRUT_RATE_LIMIT_TRUSTED_PROXIES: ${CODRUT_RATE_LIMIT_TRUSTED_PROXIES:?Set CODRUT_RATE_LIMIT_TRUSTED_PROXIES to a JSON array of trusted proxy IPs or CIDRs}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:?Set CODRUT_EMAIL_BREVO_API_KEY to the production Brevo API key}
      CODRUT_EMAIL_WEBHOOK_TOKEN: ${CODRUT_EMAIL_WEBHOOK_TOKEN:?Set CODRUT_EMAIL_WEBHOOK_TOKEN to an independent bearer token for Brevo callbacks}
      CODRUT_PASSWORD_BREACH_CHECK_ENABLED: ${CODRUT_PASSWORD_BREACH_CHECK_ENABLED:-true}
    labels:
      traefik.http.routers.codrut-api.rule: Host(`${CODRUT_HOST}`) && PathPrefix(`/api`)
      traefik.http.routers.codrut-api.entrypoints: websecure
      traefik.http.routers.codrut-api.tls.certresolver: letsencrypt
    restart: unless-stopped

  worker:
    environment:
      CODRUT_ENV: ${CODRUT_ENV:-production}
      CODRUT_DATABASE_URL: ${CODRUT_DATABASE_URL}
      CODRUT_REDIS_URL: ${CODRUT_REDIS_URL}
      CODRUT_SESSION_SECRET: ${CODRUT_SESSION_SECRET:?Set CODRUT_SESSION_SECRET to a unique secret of at least 32 characters}
      CODRUT_TASK_LINK_SECRET: ${CODRUT_TASK_LINK_SECRET:?Set CODRUT_TASK_LINK_SECRET to a stable separate signing secret}
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: ${CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET:?Set CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET to a stable dedicated signing secret}
      CODRUT_PUBLIC_APP_URL: ${CODRUT_PUBLIC_APP_URL:?Set CODRUT_PUBLIC_APP_URL to the public app origin, for example https://codrut.andreivacaru.ro}
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:?Set CODRUT_EMAIL_PROVIDER to brevo}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:?Set CODRUT_EMAIL_FROM_ADDRESS to the verified sender email address}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:?Set CODRUT_EMAIL_FROM_NAME to the sender display name}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:?Set CODRUT_EMAIL_BREVO_API_KEY to the production Brevo API key}
      CODRUT_EMAIL_WEBHOOK_TOKEN: ${CODRUT_EMAIL_WEBHOOK_TOKEN:?Set CODRUT_EMAIL_WEBHOOK_TOKEN to an independent bearer token for Brevo callbacks}
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  traefik_letsencrypt:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CODRUT_DB_VOLUME_PATH}
