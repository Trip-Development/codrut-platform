[project]
name = "codrut-backend"
version = "0.1.0"
description = "FastAPI backend for Codrut Platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "arq>=0.26.0",
  "asyncpg>=0.29.0",
  "email-validator>=2.2.0",
  "fastapi>=0.139.0",
  "google-auth>=2.35.0",
  "httpx>=0.27.0",
  "nh3>=0.3.6",
  "pillow>=11.0.0",
  "pydantic-settings>=2.14.2",
  "sqlalchemy[asyncio]>=2.0.0",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=6.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codrut"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["codrut"]
omit = ["src/codrut/tools/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
