services:
  traefik:
    command:
      - --providers.file.filename=/etc/traefik/dev-dynamic.yaml
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    volumes:
      - ./infra/traefik/dev-dynamic.yaml:/etc/traefik/dev-dynamic.yaml:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    image: codrut-platform-frontend:dev
    build:
      target: dev
    user: root
    command: ["sh", "-lc", "mkdir -p /workspace/frontend/.next && chown -R node:node /workspace/frontend/.next && exec su node -c 'pnpm dev --hostname 0.0.0.0 --port 3000'"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: /api
      CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-false}
      NEXT_PUBLIC_CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-false}
    volumes:
      - .:/workspace:cached
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_next_cache:/workspace/frontend/.next
      - pnpm_store:/home/node/.local/share/pnpm/store
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    init: true
    tty: true
    stdin_open: true

  backend:
    image: codrut-platform-backend:dev
    build:
      target: dev
    command: ["uv", "run", "uvicorn", "codrut.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src", "--reload-dir", "migrations"]
    environment:
      CODRUT_ENV: development
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_SESSION_SECRET: local-development-secret
      CODRUT_CORS_ORIGINS: '["http://localhost","http://localhost:3000","http://localhost:8000"]'
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:-test}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:-no-reply@codrut.local}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:-Codrut Platform}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:-}
      CODRUT_EMAIL_SMTP_HOST: ${CODRUT_EMAIL_SMTP_HOST:-mailpit}
      CODRUT_EMAIL_SMTP_PORT: ${CODRUT_EMAIL_SMTP_PORT:-1025}
      CODRUT_EMAIL_SMTP_USERNAME: ${CODRUT_EMAIL_SMTP_USERNAME:-}
      CODRUT_EMAIL_SMTP_PASSWORD: ${CODRUT_EMAIL_SMTP_PASSWORD:-}
      CODRUT_EMAIL_SMTP_STARTTLS: ${CODRUT_EMAIL_SMTP_STARTTLS:-false}
    volumes:
      - .:/workspace:cached
      - backend_uv_cache:/home/vscode/.cache/uv
      - backend_pip_cache:/home/vscode/.cache/pip
      - frontend_node_modules:/workspace/frontend/node_modules
      - pnpm_store:/home/vscode/.local/share/pnpm/store
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live').read()\""]
      interval: 10s
      timeout: 15s
      retries: 5
    init: true
    tty: true
    stdin_open: true

  worker:
    image: codrut-platform-backend:dev
    build:
      target: dev
    command: ["uv", "run", "python", "-m", "codrut.workers.main"]
    environment:
      CODRUT_ENV: development
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_SESSION_SECRET: local-development-secret
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:-test}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:-no-reply@codrut.local}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:-Codrut Platform}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:-}
      CODRUT_EMAIL_SMTP_HOST: ${CODRUT_EMAIL_SMTP_HOST:-mailpit}
      CODRUT_EMAIL_SMTP_PORT: ${CODRUT_EMAIL_SMTP_PORT:-1025}
      CODRUT_EMAIL_SMTP_USERNAME: ${CODRUT_EMAIL_SMTP_USERNAME:-}
      CODRUT_EMAIL_SMTP_PASSWORD: ${CODRUT_EMAIL_SMTP_PASSWORD:-}
      CODRUT_EMAIL_SMTP_STARTTLS: ${CODRUT_EMAIL_SMTP_STARTTLS:-false}
    volumes:
      - .:/workspace:cached
      - backend_uv_cache:/home/vscode/.cache/uv
      - backend_pip_cache:/home/vscode/.cache/pip
    init: true
    tty: true
    stdin_open: true

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  backend_uv_cache:
  backend_pip_cache:
  frontend_node_modules:
  frontend_next_cache:
  pnpm_store:
