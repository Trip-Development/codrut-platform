services:
  development-cache-init:
    image: codrut-platform-backend:dev
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: dev
    user: root
    command:
      - sh
      - -lc
      - >-
        find /volumes/frontend-next-cache -mindepth 1 -delete &&
        chown -R 1000:1000 /volumes
    volumes:
      - backend_uv_cache:/volumes/backend-uv-cache
      - backend_pip_cache:/volumes/backend-pip-cache
      - backend_venv:/volumes/backend-venv
      - worker_uv_cache:/volumes/worker-uv-cache
      - worker_venv:/volumes/worker-venv
      - frontend_node_modules:/volumes/frontend-node-modules
      - frontend_next_cache:/volumes/frontend-next-cache
      - pnpm_store:/volumes/pnpm-store
      - campaign_assets:/volumes/campaign-assets
    restart: "no"

  traefik:
    command:
      - --providers.file.filename=/etc/traefik/dev-dynamic.yaml
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./infra/traefik/dev-dynamic.yaml:/etc/traefik/dev-dynamic.yaml:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    image: codrut-platform-frontend:dev
    build:
      target: dev
    user: node
    command: ["pnpm", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: /api
      CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-}
      NEXT_PUBLIC_CODRUT_FRONTEND_DEMO_FALLBACK: ${CODRUT_FRONTEND_DEMO_FALLBACK:-}
      CODRUT_LOCAL_AUTH_BYPASS: ${CODRUT_LOCAL_AUTH_BYPASS:-true}
      NEXT_PUBLIC_CODRUT_LOCAL_AUTH_BYPASS: ${CODRUT_LOCAL_AUTH_BYPASS:-true}
    volumes:
      - .:/workspace:cached
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_next_cache:/workspace/frontend/.next
      - pnpm_store:/home/node/.local/share/pnpm/store
    depends_on:
      development-cache-init:
        condition: service_completed_successfully
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(async response => {
            if (!response.ok) throw new Error('page ' + response.status);
            const html = await response.text();
            const script = html.match(/<script[^>]+src="([^"]+)"/);
            if (!script) throw new Error('missing script asset');
            const asset = await fetch(new URL(script[1], response.url));
            if (!asset.ok) throw new Error('script ' + asset.status);
          }).catch(error => { console.error(error); process.exit(1); })
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    init: true
    tty: true
    stdin_open: true

  backend:
    image: codrut-platform-backend:dev
    build:
      target: dev
    user: vscode
    command: ["uv", "run", "uvicorn", "codrut.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src", "--reload-dir", "migrations"]
    environment:
      CODRUT_ENV: development
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_SESSION_SECRET: local-development-secret
      CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET: ${CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET:-local-email-suppression-fingerprint-secret}
      CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS:-30}
      CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS:-7}
      CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED: ${CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED:-false}
      CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS:-365}
      CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS: ${CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS:-365}
      CODRUT_LOCAL_AUTH_BYPASS: ${CODRUT_LOCAL_AUTH_BYPASS:-true}
      CODRUT_LOCAL_AUTH_TRAINER_EMAIL: ${CODRUT_SEED_TRAINER_EMAIL:-trainer@example.com}
      CODRUT_LOCAL_AUTH_PARTICIPANT_EMAIL: ${CODRUT_SEED_PARTICIPANT_EMAIL:-participant@example.com}
      CODRUT_CORS_ORIGINS: '["http://localhost","http://localhost:3000","http://localhost:8000"]'
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:-mailpit}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:-no-reply@codrut.local}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:-Andrei Văcaru}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:-}
      CODRUT_EMAIL_WEBHOOK_TOKEN: ${CODRUT_EMAIL_WEBHOOK_TOKEN:-codrut-local-webhook-token}
      CODRUT_EMAIL_SMTP_HOST: ${CODRUT_EMAIL_SMTP_HOST:-mailpit}
      CODRUT_EMAIL_SMTP_PORT: ${CODRUT_EMAIL_SMTP_PORT:-1025}
      CODRUT_EMAIL_SMTP_USERNAME: ${CODRUT_EMAIL_SMTP_USERNAME:-}
      CODRUT_EMAIL_SMTP_PASSWORD: ${CODRUT_EMAIL_SMTP_PASSWORD:-}
      CODRUT_EMAIL_SMTP_STARTTLS: ${CODRUT_EMAIL_SMTP_STARTTLS:-false}
      CODRUT_CAMPAIGN_ASSET_DIR: /home/vscode/.local/share/codrut/campaign-assets
      CODRUT_CAMPAIGN_ASSET_PUBLIC_PATH: /api/campaign-assets
    volumes:
      - .:/workspace:cached
      - backend_uv_cache:/home/vscode/.cache/uv
      - backend_pip_cache:/home/vscode/.cache/pip
      - backend_venv:/workspace/backend/.venv
      - frontend_node_modules:/workspace/frontend/node_modules
      - pnpm_store:/home/vscode/.local/share/pnpm/store
      - campaign_assets:/home/vscode/.local/share/codrut/campaign-assets
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      development-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5).read()\""]
      interval: 10s
      timeout: 15s
      retries: 5
    init: true
    tty: true
    stdin_open: true

  worker:
    image: codrut-platform-backend:dev
    build:
      target: dev
    user: vscode
    command: ["uv", "run", "python", "-m", "codrut.workers.main"]
    environment:
      CODRUT_ENV: development
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_SESSION_SECRET: local-development-secret
      CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET: ${CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET:-local-email-suppression-fingerprint-secret}
      CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_ARCHIVE_RETENTION_DAYS:-30}
      CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS: ${CODRUT_CAMPAIGN_RECIPIENT_DELIVERY_RECONCILIATION_DAYS:-7}
      CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED: ${CODRUT_CAMPAIGN_RECIPIENT_PURGE_ENABLED:-false}
      CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS: ${CODRUT_CAMPAIGN_DELIVERY_TOMBSTONE_RETENTION_DAYS:-365}
      CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS: ${CODRUT_EMAIL_SUPPRESSION_REVIEW_DAYS:-365}
      CODRUT_EMAIL_PROVIDER: ${CODRUT_EMAIL_PROVIDER:-mailpit}
      CODRUT_EMAIL_FROM_ADDRESS: ${CODRUT_EMAIL_FROM_ADDRESS:-no-reply@codrut.local}
      CODRUT_EMAIL_FROM_NAME: ${CODRUT_EMAIL_FROM_NAME:-Andrei Văcaru}
      CODRUT_EMAIL_BREVO_API_KEY: ${CODRUT_EMAIL_BREVO_API_KEY:-}
      CODRUT_EMAIL_WEBHOOK_TOKEN: ${CODRUT_EMAIL_WEBHOOK_TOKEN:-codrut-local-webhook-token}
      CODRUT_EMAIL_SMTP_HOST: ${CODRUT_EMAIL_SMTP_HOST:-mailpit}
      CODRUT_EMAIL_SMTP_PORT: ${CODRUT_EMAIL_SMTP_PORT:-1025}
      CODRUT_EMAIL_SMTP_USERNAME: ${CODRUT_EMAIL_SMTP_USERNAME:-}
      CODRUT_EMAIL_SMTP_PASSWORD: ${CODRUT_EMAIL_SMTP_PASSWORD:-}
      CODRUT_EMAIL_SMTP_STARTTLS: ${CODRUT_EMAIL_SMTP_STARTTLS:-false}
      CODRUT_CAMPAIGN_ASSET_DIR: /home/vscode/.local/share/codrut/campaign-assets
      CODRUT_CAMPAIGN_ASSET_PUBLIC_PATH: /api/campaign-assets
    volumes:
      - .:/workspace:cached
      - worker_uv_cache:/home/vscode/.cache/uv
      - backend_pip_cache:/home/vscode/.cache/pip
      - worker_venv:/workspace/backend/.venv
      - campaign_assets:/home/vscode/.local/share/codrut/campaign-assets
    depends_on:
      development-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "uv run python -m codrut.tools.check_worker_health"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 15s
    init: true
    tty: true
    stdin_open: true

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  backend_uv_cache:
  backend_pip_cache:
  backend_venv:
  worker_uv_cache:
  worker_venv:
  frontend_node_modules:
  frontend_next_cache:
  pnpm_store:
