name: App CI

on:
  pull_request:
    branches:
      - dev
      - prod

permissions:
  contents: read

jobs:
  backend:
    name: backend / lint-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: codrut
          POSTGRES_USER: codrut
          POSTGRES_PASSWORD: codrut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codrut -d codrut"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@localhost:5432/codrut
      CODRUT_REDIS_URL: redis://localhost:6379/0
      CODRUT_SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.8"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check src tests migrations
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    name: frontend / lint-typecheck-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  infra:
    name: infra / compose-config
    runs-on: ubuntu-latest
    env:
      TRAEFIK_ACME_EMAIL: ops@example.com
      CODRUT_HOST: codrut.example.com
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_SESSION_SECRET: compose-config-secret
      CODRUT_CORS_ORIGINS: https://codrut.example.com
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml -f compose.dev.yaml config
      - run: docker compose -f compose.yaml -f compose.prod.yaml config
