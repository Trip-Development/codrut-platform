name: App CI

on:
  pull_request:
    branches:
      - dev
      - prod
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  packages: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: app-ci / scope
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      infra: ${{ steps.scope.outputs.infra }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test CI scope rules
        working-directory: .github/scripts
        run: python3 -m unittest test_detect_ci_scope.py
      - name: Detect affected checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | python3 .github/scripts/detect_ci_scope.py >> "${GITHUB_OUTPUT}"

  backend:
    name: backend / checks
    needs: changes
    if: startsWith(github.head_ref, 'hotfix/') || (github.base_ref == 'dev' && needs.changes.outputs.backend == 'true')
    uses: ./.github/workflows/_backend-checks.yml

  frontend:
    name: frontend / checks
    needs: changes
    if: startsWith(github.head_ref, 'hotfix/') || (github.base_ref == 'dev' && needs.changes.outputs.frontend == 'true')
    uses: ./.github/workflows/_frontend-checks.yml

  e2e:
    name: end-to-end / representative
    needs: changes
    if: startsWith(github.head_ref, 'hotfix/') || (github.base_ref == 'dev' && needs.changes.outputs.e2e == 'true')
    uses: ./.github/workflows/_e2e-playwright.yml

  infra:
    name: infra / compose-config
    needs: changes
    if: startsWith(github.head_ref, 'hotfix/') || (github.base_ref == 'dev' && needs.changes.outputs.infra == 'true')
    uses: ./.github/workflows/_compose-validate.yml
    with:
      mode: both

  required:
    name: app-ci / required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always() && github.event.pull_request.draft == false
    needs:
      - changes
      - backend
      - frontend
      - e2e
      - infra
    steps:
      - name: Verify affected checks
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INFRA_REQUIRED: ${{ needs.changes.outputs.infra }}
          INFRA_RESULT: ${{ needs.infra.result }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "SCOPE_RESULT=${SCOPE_RESULT}; expected success."
            exit 1
          fi

          if [[ "${BASE_REF}" == "prod" && "${HEAD_REF}" != hotfix/* ]]; then
            for result in "${BACKEND_RESULT}" "${FRONTEND_RESULT}" "${E2E_RESULT}" "${INFRA_RESULT}"; do
              [[ "${result}" == "skipped" ]] || {
                echo "Normal dev-to-prod promotion must reuse the validated candidate; received ${result}."
                exit 1
              }
            done
            exit 0
          fi

          verify_check() {
            local name="$1"
            local required="$2"
            local result="$3"
            if [[ "${HEAD_REF}" == hotfix/* || "${required}" == "true" ]]; then
              [[ "${result}" == "success" ]] || {
                echo "${name}=${result}; expected success."
                exit 1
              }
            elif [[ "${result}" != "skipped" ]]; then
              echo "${name}=${result}; expected skipped for an unaffected surface."
              exit 1
            fi
          }

          verify_check BACKEND_RESULT "${BACKEND_REQUIRED}" "${BACKEND_RESULT}"
          verify_check FRONTEND_RESULT "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
          verify_check E2E_RESULT "${E2E_REQUIRED}" "${E2E_RESULT}"
          verify_check INFRA_RESULT "${INFRA_REQUIRED}" "${INFRA_RESULT}"
