name: App CI

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  packages: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: app-ci / scope
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      infra: ${{ steps.scope.outputs.infra }}
      automation: ${{ steps.scope.outputs.automation }}
      database: ${{ steps.scope.outputs.database }}
      contract: ${{ steps.scope.outputs.contract }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect affected checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | python3 .github/scripts/detect_ci_scope.py >> "${GITHUB_OUTPUT}"

  backend:
    name: backend / checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/_backend-checks.yml
    with:
      check_database: ${{ needs.changes.outputs.database == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      check_api_contract: ${{ needs.changes.outputs.contract == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}

  frontend:
    name: frontend / checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/_frontend-checks.yml

  e2e:
    name: end-to-end / representative
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:e2e') || contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/_e2e-playwright.yml

  infra:
    name: infra / compose-config
    needs: changes
    if: needs.changes.outputs.infra == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/_compose-validate.yml
    with:
      mode: both

  automation:
    name: automation / checks
    needs: changes
    if: needs.changes.outputs.automation == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test workflow helpers
        working-directory: .github/scripts
        run: python3 -m unittest discover -p 'test_*.py'
      - name: Parse shell helpers
        run: bash -n .github/scripts/*.sh
      - name: Parse workflow YAML
        run: >-
          ruby -e 'require "yaml";
          Dir[".github/workflows/*.{yml,yaml}"].each {
          |path| YAML.parse_file(path) }'

  required:
    name: app-ci / required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always() && github.event.pull_request.draft == false
    needs:
      - changes
      - backend
      - frontend
      - e2e
      - infra
      - automation
    steps:
      - name: Verify affected checks
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INFRA_REQUIRED: ${{ needs.changes.outputs.infra }}
          INFRA_RESULT: ${{ needs.infra.result }}
          AUTOMATION_REQUIRED: ${{ needs.changes.outputs.automation }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          FULL_REQUIRED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          E2E_LABEL_REQUIRED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:e2e') }}
        run: |
          set -euo pipefail

          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "SCOPE_RESULT=${SCOPE_RESULT}; expected success."
            exit 1
          fi

          verify_check() {
            local name="$1"
            local required="$2"
            local result="$3"
            if [[ "${required}" == "true" ]]; then
              [[ "${result}" == "success" ]] || {
                echo "${name}=${result}; expected success."
                exit 1
              }
            elif [[ "${result}" != "skipped" ]]; then
              echo "${name}=${result}; expected skipped for an unaffected surface."
              exit 1
            fi
          }

          if [[ "${FULL_REQUIRED}" == "true" ]]; then
            BACKEND_REQUIRED=true
            FRONTEND_REQUIRED=true
            INFRA_REQUIRED=true
            AUTOMATION_REQUIRED=true
            E2E_REQUIRED=true
          elif [[ "${E2E_LABEL_REQUIRED}" == "true" ]]; then
            E2E_REQUIRED=true
          fi

          verify_check BACKEND_RESULT "${BACKEND_REQUIRED}" "${BACKEND_RESULT}"
          verify_check FRONTEND_RESULT "${FRONTEND_REQUIRED}" "${FRONTEND_RESULT}"
          verify_check E2E_RESULT "${E2E_REQUIRED}" "${E2E_RESULT}"
          verify_check INFRA_RESULT "${INFRA_REQUIRED}" "${INFRA_RESULT}"
          verify_check AUTOMATION_RESULT "${AUTOMATION_REQUIRED}" "${AUTOMATION_RESULT}"
