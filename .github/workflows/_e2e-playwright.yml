name: Reusable Playwright E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: end-to-end / playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker Compose Stack
        env:
          CODRUT_FRONTEND_DEMO_FALLBACK: "false"
          CODRUT_LOCAL_AUTH_BYPASS: "false"
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml up -d --build db redis
          docker compose -f compose.yaml -f compose.dev.yaml run --rm --user vscode backend uv run alembic upgrade head
          docker compose -f compose.yaml -f compose.dev.yaml up -d --build backend worker frontend
          docker compose -f compose.yaml -f compose.dev.yaml exec -T backend uv run pytest tests/test_health.py

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

      - name: Stop Docker Compose Stack
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down
