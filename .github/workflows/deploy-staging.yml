name: VPS Staging Deployment

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-vps-deploy
  cancel-in-progress: true

jobs:
  build-images:
    name: Build Staging Images
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_STAGING_DEPLOY == 'true'
    uses: ./.github/workflows/_image-build.yml
    with:
      push: true
      tag: staging-${{ github.sha }}
    secrets: inherit

  deploy-vps:
    name: Deploy to Staging VPS
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_STAGING_DEPLOY == 'true'
    needs: build-images
    uses: ./.github/workflows/_deploy-vps.yml
    with:
      environment: staging
      backend_image: ${{ needs.build-images.outputs.backend-image }}
      frontend_image: ${{ needs.build-images.outputs.frontend-image }}
      release_sha: ${{ needs.build-images.outputs.release-sha }}
    secrets: inherit
