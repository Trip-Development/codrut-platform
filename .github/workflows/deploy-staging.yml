name: Dev Candidate

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: candidate / immutable-images
    uses: ./.github/workflows/_image-build.yml
    with:
      push: true
      tag: sha-${{ github.sha }}
      ref: ${{ github.sha }}
      cache_scope: trusted-dev
    secrets: inherit
