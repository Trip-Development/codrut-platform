name: Reusable Compose Validation

on:
  workflow_call:
    inputs:
      mode:
        description: Use both for dev+prod validation or prod for production only.
        required: false
        type: string
        default: both
      backend_image:
        required: false
        type: string
        default: ghcr.io/example/codrut-platform-backend:compose-check
      frontend_image:
        required: false
        type: string
        default: ghcr.io/example/codrut-platform-frontend:compose-check

permissions:
  contents: read

jobs:
  compose:
    name: infra / compose-config
    runs-on: ubuntu-latest
    env:
      FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      TRAEFIK_ACME_EMAIL: ops@example.com
      CODRUT_HOST: codrut.example.com
      POSTGRES_DB: codrut
      POSTGRES_USER: codrut
      POSTGRES_PASSWORD: codrut
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_RATE_LIMIT_TRUSTED_PROXIES: '["10.0.0.2"]'
      CODRUT_SESSION_SECRET: compose-config-secret
      CODRUT_TASK_LINK_SECRET: compose-config-task-link-secret
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: compose-config-campaign-asset-secret
      CODRUT_CORS_ORIGINS: '["https://codrut.example.com"]'
      CODRUT_PUBLIC_APP_URL: https://codrut.example.com
      CODRUT_EMAIL_PROVIDER: brevo
      CODRUT_EMAIL_FROM_ADDRESS: ops@example.com
      CODRUT_EMAIL_FROM_NAME: Andrei Văcaru
      CODRUT_EMAIL_BREVO_API_KEY: compose-config-placeholder
      CODRUT_EMAIL_WEBHOOK_TOKEN: compose-webhook-token-with-at-least-32-characters
      CODRUT_DB_VOLUME_PATH: /tmp/codrut-postgres-data
    steps:
      - uses: actions/checkout@v4
      - name: Validate Development Compose Config
        if: inputs.mode == 'both'
        run: docker compose -f compose.yaml -f compose.dev.yaml config >/dev/null
      - name: Validate Production Compose Config
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml config --format json > /tmp/compose-prod.json
          python3 - <<'PY'
          import json

          with open("/tmp/compose-prod.json", encoding="utf-8") as config_file:
              services = json.load(config_file)["services"]

          backend_origin = services["backend"]["environment"]["CODRUT_CORS_ORIGINS"]
          worker_origin = services["worker"]["environment"]["CODRUT_CORS_ORIGINS"]
          if worker_origin != backend_origin:
              raise SystemExit("Worker and backend production CORS origins must match.")
          PY
