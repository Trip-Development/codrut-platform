name: Reusable Compose Validation

on:
  workflow_call:
    inputs:
      mode:
        description: Use both for dev+prod validation or prod for production only.
        required: false
        type: string
        default: both
      backend_image:
        required: false
        type: string
        default: ghcr.io/example/codrut-platform-backend:compose-check
      frontend_image:
        required: false
        type: string
        default: ghcr.io/example/codrut-platform-frontend:compose-check

permissions:
  contents: read

jobs:
  compose:
    name: infra / compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      TRAEFIK_ACME_EMAIL: ops@example.com
      CODRUT_HOST: codrut.example.com
      POSTGRES_DB: codrut
      POSTGRES_USER: codrut
      POSTGRES_PASSWORD: codrut
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@db:5432/codrut
      CODRUT_REDIS_URL: redis://redis:6379/0
      CODRUT_RATE_LIMIT_TRUSTED_PROXIES: '["10.0.0.2"]'
      CODRUT_SESSION_SECRET: compose-config-secret
      CODRUT_TASK_LINK_SECRET: compose-config-task-link-secret
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: compose-config-campaign-asset-secret
      CODRUT_CORS_ORIGINS: '["https://codrut.example.com"]'
      CODRUT_PUBLIC_APP_URL: https://codrut.example.com
      CODRUT_EMAIL_PROVIDER: brevo
      CODRUT_EMAIL_FROM_ADDRESS: ops@example.com
      CODRUT_EMAIL_FROM_NAME: Andrei Văcaru
      CODRUT_EMAIL_BREVO_API_KEY: compose-config-placeholder
      CODRUT_EMAIL_WEBHOOK_TOKEN: compose-webhook-token-with-at-least-32-characters
      CODRUT_DB_VOLUME_PATH: /tmp/codrut-postgres-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Development Compose Config
        if: inputs.mode == 'both'
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml config --format json > /tmp/compose-dev.json
          python3 - <<'PY'
          import json

          with open("/tmp/compose-dev.json", encoding="utf-8") as config_file:
              services = json.load(config_file)["services"]

          frontend = services["frontend"]
          backend = services["backend"]
          worker = services["worker"]
          cache_init = services["development-cache-init"]
          if frontend.get("user") != "node":
              raise SystemExit("Development frontend must run as node to keep cache ownership stable.")
          if backend.get("user") != "vscode" or worker.get("user") != "vscode":
              raise SystemExit("Development backend processes must run as vscode to keep cache ownership stable.")
          if cache_init.get("user") != "root":
              raise SystemExit("Development cache initializer must run as root to repair existing volumes.")
          cache_command = " ".join(cache_init.get("command", []))
          if "frontend-next-cache" not in cache_command or "-delete" not in cache_command:
              raise SystemExit("Development startup must clear the disposable Next.js cache.")
          if not frontend.get("healthcheck", {}).get("test"):
              raise SystemExit("Development frontend must verify that emitted script assets resolve.")
          for service_name in ("frontend", "backend", "worker"):
              cache_dependency = services[service_name].get("depends_on", {}).get(
                  "development-cache-init",
                  {},
              )
              if cache_dependency.get("condition") != "service_completed_successfully":
                  raise SystemExit(
                      f"Development {service_name} must wait for cache ownership initialization."
                  )
          PY
      - name: Validate Production Compose Config
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml config --format json > /tmp/compose-prod.json
          python3 - <<'PY'
          import json

          with open("/tmp/compose-prod.json", encoding="utf-8") as config_file:
              services = json.load(config_file)["services"]

          backend_origin = services["backend"]["environment"]["CODRUT_CORS_ORIGINS"]
          worker_origin = services["worker"]["environment"]["CODRUT_CORS_ORIGINS"]
          if worker_origin != backend_origin:
              raise SystemExit("Worker and backend production CORS origins must match.")

          expected_logging = {
              "driver": "json-file",
              "options": {"max-file": "5", "max-size": "10m"},
          }
          for service_name, service in services.items():
              if service.get("logging") != expected_logging:
                  raise SystemExit(
                      f"Production {service_name} must use bounded json-file logs."
                  )

          backend_command = services["backend"].get("command", [])
          if "--workers" not in backend_command:
              raise SystemExit("Production backend must configure explicit Uvicorn workers.")
          worker_index = backend_command.index("--workers") + 1
          if backend_command[worker_index] != "4":
              raise SystemExit("Production backend must default to four Uvicorn workers.")

          for service_name in ("backend", "worker"):
              environment = services[service_name]["environment"]
              expected_pool = {
                  "CODRUT_DB_POOL_SIZE": "5",
                  "CODRUT_DB_MAX_OVERFLOW": "5",
                  "CODRUT_DB_POOL_TIMEOUT_SECONDS": "10",
              }
              if any(environment.get(key) != value for key, value in expected_pool.items()):
                  raise SystemExit(
                      f"Production {service_name} must use the bounded database pool defaults."
                  )

          frontend_labels = services["frontend"]["labels"]
          backend_labels = services["backend"]["labels"]
          for service_name in ("frontend", "backend"):
              environment = services[service_name]["environment"]
              if environment.get("CODRUT_LOCAL_AUTH_BYPASS") != "false":
                  raise SystemExit(
                      f"Production {service_name} must explicitly disable local auth bypass."
                  )
          if services["frontend"]["environment"].get("NEXT_PUBLIC_CODRUT_LOCAL_AUTH_BYPASS") != "false":
              raise SystemExit("Production frontend public auth bypass must be disabled.")
          if frontend_labels.get("traefik.http.middlewares.codrut-hsts.headers.stsSeconds") != "31536000":
              raise SystemExit("Production HSTS must remain enabled for one year.")
          for labels, router in (
              (frontend_labels, "codrut-frontend"),
              (backend_labels, "codrut-api"),
          ):
              if labels.get(f"traefik.http.routers.{router}.middlewares") != "codrut-hsts":
                  raise SystemExit(f"Production router {router} must use the HSTS middleware.")
          PY
      - name: Validate E2E Runtime Compose Config
        run: |
          docker compose -f compose.yaml -f compose.e2e.yaml config --format json > /tmp/compose-e2e.json
          python3 - <<'PY'
          import json

          with open("/tmp/compose-e2e.json", encoding="utf-8") as config_file:
              services = json.load(config_file)["services"]

          for service_name in ("backend", "worker"):
              environment = services[service_name]["environment"]
              if environment.get("CODRUT_ENV") != "test":
                  raise SystemExit(f"E2E {service_name} must use the isolated test environment.")
              if environment.get("CODRUT_EMAIL_PROVIDER") != "mailpit":
                  raise SystemExit(f"E2E {service_name} must use Mailpit.")
          frontend = services["frontend"]["environment"]
          if frontend.get("NEXT_PUBLIC_CODRUT_LOCAL_AUTH_BYPASS") != "false":
              raise SystemExit("E2E frontend must exercise real authentication.")
          PY
