name: Security

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets:
    name: security / secrets
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${archive}" "${url}"
          printf '%s  %s\n' "${expected_sha256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          mkdir --parents "${RUNNER_TEMP}/bin"
          install "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Scan incoming commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"

  dependencies:
    name: security / dependency-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  required:
    name: security / required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always() && github.event.pull_request.draft == false
    needs:
      - secrets
      - dependencies
    steps:
      - name: Verify required security checks
        shell: bash
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
        run: |
          set -euo pipefail

          if [[ "${SECRETS_RESULT}" != "success" ]]; then
            echo "SECRETS_RESULT=${SECRETS_RESULT}; expected success."
            exit 1
          fi

          if [[ "${DEPENDENCIES_RESULT}" != "success" ]]; then
            echo "DEPENDENCIES_RESULT=${DEPENDENCIES_RESULT}; expected success."
            exit 1
          fi
