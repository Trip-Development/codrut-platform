name: Reusable Image Build

on:
  workflow_call:
    inputs:
      push:
        description: Push images to GHCR when true; otherwise build only.
        required: false
        type: boolean
        default: false
      tag:
        description: Image tag to build.
        required: false
        type: string
        default: ci
      ref:
        description: Git ref or SHA to check out before building images.
        required: false
        type: string
        default: ""
      cache_scope:
        description: Isolated BuildKit cache namespace for the caller trust boundary.
        required: false
        type: string
        default: pr
    outputs:
      backend-image:
        value: ${{ jobs.prepare.outputs.backend-image }}
      frontend-image:
        value: ${{ jobs.prepare.outputs.frontend-image }}
      release-sha:
        value: ${{ jobs.prepare.outputs.release-sha }}

permissions:
  contents: read
  packages: write

# Backendul si frontendul nu depind unul de altul, dar pana la plicul 36 erau doi pasi
# in aceeasi sarcina, deci se faceau unul dupa altul. Acum `prepare` calculeaza o
# singura data numele imaginilor si comiterea, iar cele doua constructii merg in
# paralel. Memoriile raman separate, fiecare cu domeniul ei.
jobs:
  prepare:
    name: images / prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
      release-sha: ${{ steps.images.outputs.release-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Lowercase Repository Name
        id: repo-name
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set Image Refs
        id: images
        shell: bash
        env:
          OWNER: ${{ steps.repo-name.outputs.owner }}
          REPO: ${{ steps.repo-name.outputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "release-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${OWNER}/${REPO}-backend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/${REPO}-frontend:${TAG}" >> "$GITHUB_OUTPUT"

  backend:
    name: images / backend
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Backend Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          target: runtime
          push: ${{ inputs.push }}
          tags: ${{ needs.prepare.outputs.backend-image }}
          cache-from: type=gha,scope=codrut-backend-${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=codrut-backend-${{ inputs.cache_scope }}
          provenance: ${{ inputs.push && 'mode=max' || false }}
          sbom: ${{ inputs.push }}

  frontend:
    name: images / frontend
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Frontend Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: ${{ inputs.push }}
          tags: ${{ needs.prepare.outputs.frontend-image }}
          cache-from: type=gha,scope=codrut-frontend-${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=codrut-frontend-${{ inputs.cache_scope }}
          provenance: ${{ inputs.push && 'mode=max' || false }}
          sbom: ${{ inputs.push }}
