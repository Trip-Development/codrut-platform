name: Reusable Image Build

on:
  workflow_call:
    inputs:
      push:
        description: Push images to GHCR when true; otherwise build only.
        required: false
        type: boolean
        default: false
      tag:
        description: Image tag to build.
        required: false
        type: string
        default: ci
    outputs:
      backend-image:
        value: ${{ jobs.images.outputs.backend-image }}
      frontend-image:
        value: ${{ jobs.images.outputs.frontend-image }}
      release-sha:
        value: ${{ jobs.images.outputs.release-sha }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: images / build
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
      release-sha: ${{ steps.images.outputs.release-sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase Repository Name
        id: repo-name
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set Image Refs
        id: images
        shell: bash
        env:
          OWNER: ${{ steps.repo-name.outputs.owner }}
          REPO: ${{ steps.repo-name.outputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "release-sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${OWNER}/${REPO}-backend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/${REPO}-frontend:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          target: runtime
          push: ${{ inputs.push }}
          tags: ${{ steps.images.outputs.backend }}
          cache-from: type=gha,scope=codrut-backend
          cache-to: type=gha,mode=max,scope=codrut-backend

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: ${{ inputs.push }}
          tags: ${{ steps.images.outputs.frontend }}
          cache-from: type=gha,scope=codrut-frontend
          cache-to: type=gha,mode=max,scope=codrut-frontend
