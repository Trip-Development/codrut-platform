name: Reusable Backend Checks

on:
  workflow_call:
    inputs:
      check_database:
        description: Run migration drift checks for schema-affecting changes.
        required: false
        type: boolean
        default: false
      check_api_contract:
        description: Verify OpenAPI and generated frontend types.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: backend / lint-migrate-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: codrut
          POSTGRES_USER: codrut
          POSTGRES_PASSWORD: codrut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codrut -d codrut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@localhost:5432/codrut
      CODRUT_REDIS_URL: redis://localhost:6379/0
      CODRUT_SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run alembic upgrade head
      - if: inputs.check_database
        name: Check migration metadata
        run: uv run alembic check
      - name: Run backend tests
        run: uv run pytest -q

  api-contract:
    name: backend / api-contract
    if: inputs.check_api_contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CODRUT_SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Check committed OpenAPI snapshot
        working-directory: backend
        run: uv run python -m codrut.tools.export_openapi --check --output ../docs/api/openapi.json
      - name: Check generated frontend API types
        working-directory: frontend
        run: |
          pnpm exec openapi-typescript ../docs/api/openapi.json -o /tmp/codrut-schema.d.ts
          cmp --silent /tmp/codrut-schema.d.ts src/api/generated/schema.d.ts || {
            echo "Generated frontend API types differ from the committed OpenAPI snapshot."
            exit 1
          }
