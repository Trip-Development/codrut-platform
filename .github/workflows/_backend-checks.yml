name: Reusable Backend Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: backend / lint-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: codrut
          POSTGRES_USER: codrut
          POSTGRES_PASSWORD: codrut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codrut -d codrut"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      CODRUT_DATABASE_URL: postgresql+asyncpg://codrut:codrut@localhost:5432/codrut
      CODRUT_REDIS_URL: redis://localhost:6379/0
      CODRUT_SESSION_SECRET: ci-session-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.7.8"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: uv sync
      - run: uv run ruff check src tests migrations
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - name: Check committed OpenAPI snapshot
        run: uv run python -m codrut.tools.export_openapi --check --output ../docs/api/openapi.json
      - name: Check generated frontend API types
        working-directory: frontend
        run: |
          pnpm exec openapi-typescript ../docs/api/openapi.json -o /tmp/codrut-schema.d.ts
          cmp --silent /tmp/codrut-schema.d.ts src/api/generated/schema.d.ts || {
            echo "Generated frontend API types differ from the committed OpenAPI snapshot."
            exit 1
          }
