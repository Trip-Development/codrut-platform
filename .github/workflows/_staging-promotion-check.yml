name: Reusable Candidate Promotion Check

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact dev commit SHA that must have a validated candidate.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  candidate:
    name: policy / validated-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require successful candidate for release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            runs_json="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-staging.yml/runs?branch=dev&event=push&per_page=100")"

            run_record="$(jq --raw-output --arg sha "${RELEASE_SHA}" \
              '.workflow_runs
               | map(select(.head_sha == $sha))
               | sort_by(.created_at)
               | last
               | if . == null then empty else [.id, .status, (.conclusion // "")] | @tsv end' \
              <<< "${runs_json}")"

            if [[ -n "${run_record}" ]]; then
              IFS=$'\t' read -r run_id run_status run_conclusion <<< "${run_record}"
              if [[ "${run_status}" == "completed" ]]; then
                if [[ "${run_conclusion}" == "success" ]]; then
                  echo "Validated immutable candidate ${run_id} found for ${RELEASE_SHA}."
                  exit 0
                fi
                echo "Dev Candidate run ${run_id} completed with ${run_conclusion}."
                exit 1
              fi
              echo "Dev Candidate run ${run_id} is ${run_status}; waiting (${attempt}/40)."
            else
              echo "Dev Candidate run for ${RELEASE_SHA} has not started; waiting (${attempt}/40)."
            fi
            sleep 15
          done

          echo "No successful Dev Candidate run completed for ${RELEASE_SHA} within 10 minutes."
          exit 1
