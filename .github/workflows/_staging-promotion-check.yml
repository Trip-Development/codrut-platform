name: Reusable Staging Promotion Check

on:
  workflow_call:
    inputs:
      release_sha:
        description: Commit SHA that must have reached staging.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  staging-promotion:
    name: policy / staging-promotion
    runs-on: ubuntu-latest
    steps:
      - name: Require successful staging deploy for release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          runs_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-staging.yml/runs?branch=dev&status=success&per_page=100")"

          mapfile -t run_ids < <(jq --raw-output --arg sha "${RELEASE_SHA}" \
            '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' <<< "${runs_json}")

          if [[ "${#run_ids[@]}" -eq 0 ]]; then
            echo "No successful staging workflow run found for release SHA ${RELEASE_SHA}."
            echo "Deploy dev to staging before opening or updating the dev -> prod PR."
            exit 1
          fi

          for run_id in "${run_ids[@]}"; do
            jobs_json="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"

            if jq --exit-status \
              '.jobs[] | select((.name | contains("Deploy to Staging VPS")) and .conclusion == "success")' \
              <<< "${jobs_json}" >/dev/null; then
              echo "Staging deploy ${run_id} completed successfully for ${RELEASE_SHA}."
              exit 0
            fi
          done

          echo "Staging workflow succeeded for ${RELEASE_SHA}, but no successful Deploy to Staging VPS job was found."
          echo "A guard-only or skipped staging run is not enough for production promotion."
          exit 1
