name: Policy

on:
  pull_request:
    branches:
      - dev
      - prod
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  actions: read
  contents: read

jobs:
  pr-hygiene:
    name: policy / pr-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout policy scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test pull request policy
        working-directory: .github/scripts
        run: python3 -m unittest test_validate_pr_metadata.py

      - name: Validate title and work tracking reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 .github/scripts/validate_pr_metadata.py

  release-source:
    name: policy / release-source
    if: github.base_ref == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require release or hotfix source
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "${SOURCE_BRANCH}" != "dev" && "${SOURCE_BRANCH}" != hotfix/* ]]; then
            echo "Production PRs must promote dev or an emergency hotfix/* branch; received ${SOURCE_BRANCH}."
            exit 1
          fi

  required:
    name: policy / required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    needs:
      - pr-hygiene
      - release-source
    steps:
      - name: Verify required policy checks
        shell: bash
        env:
          PR_HYGIENE_RESULT: ${{ needs['pr-hygiene'].result }}
          RELEASE_SOURCE_RESULT: ${{ needs['release-source'].result }}
        run: |
          set -euo pipefail

          if [[ "${PR_HYGIENE_RESULT}" != "success" ]]; then
            echo "PR_HYGIENE_RESULT=${PR_HYGIENE_RESULT}; expected success."
            exit 1
          fi

          if [[ "${RELEASE_SOURCE_RESULT}" != "success" && "${RELEASE_SOURCE_RESULT}" != "skipped" ]]; then
            echo "RELEASE_SOURCE_RESULT=${RELEASE_SOURCE_RESULT}; expected success or skipped."
            exit 1
          fi
