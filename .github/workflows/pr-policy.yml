name: Policy

on:
  pull_request:
    branches:
      - dev
      - prod
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  actions: read
  contents: read

jobs:
  pr-hygiene:
    name: policy / pr-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Validate title and work tracking reference
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          title_pattern='^(feat|fix|build|docs|chore|ci|refactor|perf|test|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "${PR_TITLE}" =~ ${title_pattern} ]]; then
            echo "PR title must follow Conventional Commits, for example: build(repo): add delivery checks."
            exit 1
          fi

          if jq -e 'index("admin-exempt") != null' <<< "${PR_LABELS}" >/dev/null; then
            echo "Administrative exemption label present."
            exit 0
          fi

          shopt -s nocasematch
          issue_pattern='(^|[[:space:](])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|references?)[[:space:]]+#[0-9]+([[:space:],.)]|$)'
          if [[ ! "${PR_BODY}" =~ ${issue_pattern} ]]; then
            echo "PR body must include Closes #123 or Refs #123, unless labeled admin-exempt."
            exit 1
          fi

  release-source:
    name: policy / release-source
    if: github.base_ref == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Require release or hotfix source
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "${SOURCE_BRANCH}" != "dev" && "${SOURCE_BRANCH}" != hotfix/* ]]; then
            echo "Production PRs must promote dev or an emergency hotfix/* branch; received ${SOURCE_BRANCH}."
            exit 1
          fi

  staging-promotion:
    name: policy / staging-promotion
    if: github.base_ref == 'prod' && github.head_ref == 'dev' && vars.ENABLE_STAGING_DEPLOY == 'true'
    uses: ./.github/workflows/_staging-promotion-check.yml
    with:
      release_sha: ${{ github.event.pull_request.head.sha }}

  required:
    name: policy / required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - pr-hygiene
      - release-source
      - staging-promotion
    steps:
      - name: Verify required policy checks
        shell: bash
        env:
          PR_HYGIENE_RESULT: ${{ needs['pr-hygiene'].result }}
          RELEASE_SOURCE_RESULT: ${{ needs['release-source'].result }}
          STAGING_PROMOTION_RESULT: ${{ needs['staging-promotion'].result }}
        run: |
          set -euo pipefail

          if [[ "${PR_HYGIENE_RESULT}" != "success" ]]; then
            echo "PR_HYGIENE_RESULT=${PR_HYGIENE_RESULT}; expected success."
            exit 1
          fi

          if [[ "${RELEASE_SOURCE_RESULT}" != "success" && "${RELEASE_SOURCE_RESULT}" != "skipped" ]]; then
            echo "RELEASE_SOURCE_RESULT=${RELEASE_SOURCE_RESULT}; expected success or skipped."
            exit 1
          fi

          if [[ "${STAGING_PROMOTION_RESULT}" != "success" && "${STAGING_PROMOTION_RESULT}" != "skipped" ]]; then
            echo "STAGING_PROMOTION_RESULT=${STAGING_PROMOTION_RESULT}; expected success or skipped."
            exit 1
          fi
