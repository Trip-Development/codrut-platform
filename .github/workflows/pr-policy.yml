name: Policy

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  actions: read
  contents: read

jobs:
  pr-hygiene:
    name: policy / pr-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout policy scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test repository policy scripts
        working-directory: .github/scripts
        run: python3 -m unittest discover -p 'test_*.py'

      - name: Validate title and work tracking reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 .github/scripts/validate_pr_metadata.py

  required:
    name: policy / required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    needs:
      - pr-hygiene
    steps:
      - name: Verify required policy checks
        shell: bash
        env:
          PR_HYGIENE_RESULT: ${{ needs['pr-hygiene'].result }}
        run: |
          set -euo pipefail

          if [[ "${PR_HYGIENE_RESULT}" != "success" ]]; then
            echo "PR_HYGIENE_RESULT=${PR_HYGIENE_RESULT}; expected success."
            exit 1
          fi
