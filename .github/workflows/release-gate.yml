name: Release Gate

on:
  pull_request:
    branches:
      - prod
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    name: release / validated-candidate
    if: github.head_ref == 'dev'
    uses: ./.github/workflows/_staging-promotion-check.yml
    with:
      release_sha: ${{ github.event.pull_request.head.sha }}

  prod-compose:
    name: release / prod-compose-config
    uses: ./.github/workflows/_compose-validate.yml
    with:
      mode: prod
      backend_image: ghcr.io/example/codrut-platform-backend:sha-${{ github.event.pull_request.head.sha }}
      frontend_image: ghcr.io/example/codrut-platform-frontend:sha-${{ github.event.pull_request.head.sha }}

  hotfix-images:
    name: release / hotfix-image-build
    if: startsWith(github.head_ref, 'hotfix/')
    uses: ./.github/workflows/_image-build.yml
    with:
      push: false
      tag: release-gate-${{ github.event.pull_request.head.sha }}
      ref: ${{ github.event.pull_request.head.sha }}
      cache_scope: hotfix-pr

  required:
    name: release / required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    needs:
      - candidate
      - prod-compose
      - hotfix-images
    steps:
      - name: Verify release gate
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PROD_COMPOSE_RESULT: ${{ needs.prod-compose.result }}
          HOTFIX_IMAGES_RESULT: ${{ needs.hotfix-images.result }}
        run: |
          set -euo pipefail
          [[ "${PROD_COMPOSE_RESULT}" == "success" ]] || {
            echo "PROD_COMPOSE_RESULT=${PROD_COMPOSE_RESULT}; expected success."
            exit 1
          }
          if [[ "${SOURCE_BRANCH}" == "dev" ]]; then
            [[ "${CANDIDATE_RESULT}" == "success" && "${HOTFIX_IMAGES_RESULT}" == "skipped" ]] || {
              echo "Dev promotion requires its validated candidate and no rebuild."
              exit 1
            }
          elif [[ "${SOURCE_BRANCH}" == hotfix/* ]]; then
            [[ "${CANDIDATE_RESULT}" == "skipped" && "${HOTFIX_IMAGES_RESULT}" == "success" ]] || {
              echo "Hotfix promotion requires a direct image build."
              exit 1
            }
          else
            echo "Unsupported release source ${SOURCE_BRANCH}."
            exit 1
          fi
