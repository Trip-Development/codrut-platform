name: Release Gate

on:
  pull_request:
    branches:
      - prod
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: read
  contents: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    name: release / validated-candidate
    if: github.event.pull_request.draft == false && github.head_ref == 'dev'
    uses: ./.github/workflows/_staging-promotion-check.yml
    with:
      release_sha: ${{ github.event.pull_request.head.sha }}

  tree:
    name: release / exact-dev-tree
    if: github.event.pull_request.draft == false && github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require the release merge to match dev exactly
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/verify_release_tree.py "${BASE_SHA}" "${HEAD_SHA}"

  required:
    name: release / required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always() && github.event.pull_request.draft == false
    needs:
      - candidate
      - tree
    steps:
      - name: Verify release gate
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          TREE_RESULT: ${{ needs.tree.result }}
        run: |
          set -euo pipefail

          [[ "${SOURCE_BRANCH}" == "dev" ]] || {
            echo "Production releases must promote dev; received ${SOURCE_BRANCH}."
            exit 1
          }

          [[ "${CANDIDATE_RESULT}" == "success" ]] || {
            echo "CANDIDATE_RESULT=${CANDIDATE_RESULT}; expected success."
            exit 1
          }

          [[ "${TREE_RESULT}" == "success" ]] || {
            echo "TREE_RESULT=${TREE_RESULT}; expected success."
            exit 1
          }
