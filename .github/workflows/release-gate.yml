name: Release Gate

on:
  pull_request:
    branches:
      - prod
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  packages: write

concurrency:
  group: release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prod-compose:
    name: release / prod-compose-config
    uses: ./.github/workflows/_compose-validate.yml
    with:
      mode: prod
      backend_image: ghcr.io/example/codrut-platform-backend:${{ github.event.pull_request.head.sha }}
      frontend_image: ghcr.io/example/codrut-platform-frontend:${{ github.event.pull_request.head.sha }}

  image-build:
    name: release / image-build
    if: startsWith(github.head_ref, 'hotfix/')
    uses: ./.github/workflows/_image-build.yml
    with:
      push: false
      tag: release-gate-${{ github.event.pull_request.head.sha }}
      ref: ${{ github.event.pull_request.head.sha }}

  required:
    name: release / required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prod-compose
      - image-build
    steps:
      - name: Verify release gate checks
        shell: bash
        env:
          PROD_COMPOSE_RESULT: ${{ needs['prod-compose'].result }}
          IMAGE_BUILD_RESULT: ${{ needs['image-build'].result }}
        run: |
          set -euo pipefail

          if [[ "${PROD_COMPOSE_RESULT}" != "success" ]]; then
            echo "PROD_COMPOSE_RESULT=${PROD_COMPOSE_RESULT}; expected success."
            exit 1
          fi

          if [[ "${IMAGE_BUILD_RESULT}" != "success" && "${IMAGE_BUILD_RESULT}" != "skipped" ]]; then
              echo "IMAGE_BUILD_RESULT=${IMAGE_BUILD_RESULT}; expected success for hotfix production PRs or skipped for dev releases."
              exit 1
          fi
