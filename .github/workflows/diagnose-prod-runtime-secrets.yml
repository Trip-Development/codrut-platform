name: Diagnose Production Runtime Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Validate runtime secret independence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    env:
      CODRUT_SESSION_SECRET: ${{ secrets.CODRUT_SESSION_SECRET }}
      CODRUT_TASK_LINK_SECRET: ${{ secrets.CODRUT_TASK_LINK_SECRET }}
      CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET: ${{ secrets.CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET }}
      CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET: ${{ secrets.CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET }}
      CODRUT_EMAIL_WEBHOOK_TOKEN: ${{ secrets.CODRUT_EMAIL_WEBHOOK_TOKEN }}
    steps:
      - name: Identify invalid runtime secret purposes
        shell: python
        run: |
          import os
          import sys

          secrets = {
              "session": os.environ["CODRUT_SESSION_SECRET"].strip(),
              "task-link": os.environ["CODRUT_TASK_LINK_SECRET"].strip(),
              "campaign-asset": os.environ["CODRUT_CAMPAIGN_ASSET_SIGNING_SECRET"].strip(),
              "email-suppression": os.environ[
                  "CODRUT_EMAIL_SUPPRESSION_FINGERPRINT_SECRET"
              ].strip(),
              "email-webhook": os.environ["CODRUT_EMAIL_WEBHOOK_TOKEN"].strip(),
          }

          invalid = [purpose for purpose, value in secrets.items() if len(value) < 32]
          duplicates = {
              tuple(sorted(purpose for purpose, candidate in secrets.items() if candidate == value))
              for value in secrets.values()
          }
          duplicates = sorted(group for group in duplicates if len(group) > 1)

          for purpose in invalid:
              print(f"Invalid length: {purpose}", file=sys.stderr)
          for group in duplicates:
              print(f"Duplicate purposes: {', '.join(group)}", file=sys.stderr)

          if invalid or duplicates:
              raise SystemExit(1)

          print("Production runtime secrets are independent and meet the minimum length.")
