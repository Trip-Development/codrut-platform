name: VPS Production Deployment

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      confirm_prod_ref:
        description: Type prod to confirm this deployment is running from refs/heads/prod.
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: prod-vps-deploy
  cancel-in-progress: false

jobs:
  guard-prod-ref:
    name: Guard Production Ref
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require prod ref before image push
        shell: bash
        env:
          CONFIRM_PROD_REF: ${{ github.event.inputs.confirm_prod_ref || '' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/prod" ]]; then
            echo "Production deployment must run from refs/heads/prod before images are built; received ${GITHUB_REF}."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${CONFIRM_PROD_REF}" != "prod" ]]; then
            echo "Manual production deployments require confirm_prod_ref=prod."
            exit 1
          fi

  build-images:
    name: Build Production Images
    needs:
      - guard-prod-ref
      - deploy-preflight
      - resolve-release-source
      - resolve-images
    if: needs.resolve-images.outputs.images-exist != 'true' && needs.resolve-release-source.outputs.deployment-kind == 'hotfix'
    uses: ./.github/workflows/_image-build.yml
    with:
      push: true
      tag: sha-${{ needs.resolve-release-source.outputs.source-sha }}
      ref: ${{ needs.resolve-release-source.outputs.source-sha }}
      cache_scope: trusted-hotfix
    secrets: inherit

  deploy-preflight:
    name: Validate Production Deploy Config
    needs: guard-prod-ref
    uses: ./.github/workflows/_deploy-preflight.yml
    with:
      environment: prod
    secrets: inherit

  resolve-release-source:
    name: Resolve Release Source
    needs: guard-prod-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      deployment-kind: ${{ steps.source.outputs.deployment-kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev:refs/remotes/origin/dev

          read -r -a commit_line <<< "$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          source_sha="${GITHUB_SHA}"
          if [[ "${#commit_line[@]}" -ge 3 ]]; then
            source_sha="${commit_line[2]}"
          fi

          deployment_kind="hotfix"
          if git merge-base --is-ancestor "${source_sha}" refs/remotes/origin/dev; then
            deployment_kind="candidate"
          fi

          echo "source-sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "deployment-kind=${deployment_kind}" >> "$GITHUB_OUTPUT"
          echo "Using ${source_sha} as the immutable ${deployment_kind} deployment source."

  resolve-images:
    name: Resolve Candidate Images
    needs:
      - guard-prod-ref
      - resolve-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
      images-exist: ${{ steps.check.outputs.images-exist }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase Repository Name
        id: repo-name
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set Candidate Image Refs
        id: images
        shell: bash
        env:
          OWNER: ${{ steps.repo-name.outputs.owner }}
          REPO: ${{ steps.repo-name.outputs.repo }}
          TAG: sha-${{ needs.resolve-release-source.outputs.source-sha }}
        run: |
          set -euo pipefail
          echo "backend=ghcr.io/${OWNER}/${REPO}-backend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/${REPO}-frontend:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check Candidate Image Availability
        id: check
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          DEPLOYMENT_KIND: ${{ needs.resolve-release-source.outputs.deployment-kind }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${BACKEND_IMAGE}" >/dev/null 2>&1 && docker manifest inspect "${FRONTEND_IMAGE}" >/dev/null 2>&1; then
            echo "images-exist=true" >> "$GITHUB_OUTPUT"
            echo "Found previously built candidate images."
            exit 0
          fi

          echo "images-exist=false" >> "$GITHUB_OUTPUT"
          if [[ "${DEPLOYMENT_KIND}" == "candidate" ]]; then
            echo "Validated candidate images are missing; refusing to rebuild during production promotion."
            exit 1
          fi
          echo "Hotfix images are missing; production will build the reviewed hotfix source."

  deploy-vps:
    name: Deploy to Hetzner VPS
    needs:
      - build-images
      - deploy-preflight
      - guard-prod-ref
      - resolve-images
      - resolve-release-source
    if: always() && needs.guard-prod-ref.result == 'success' && needs.deploy-preflight.result == 'success' && needs.resolve-images.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    uses: ./.github/workflows/_deploy-vps.yml
    with:
      environment: prod
      backend_image: ${{ needs.resolve-images.outputs.backend-image }}
      frontend_image: ${{ needs.resolve-images.outputs.frontend-image }}
      release_sha: ${{ needs.resolve-release-source.outputs.source-sha }}
      app_environment: production
      require_prod_ref: true
      prod_confirmation: ${{ github.event.inputs.confirm_prod_ref || '' }}
    secrets: inherit
